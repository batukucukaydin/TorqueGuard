[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "torqueguard"
version = "0.2.0"
description = "Stateful hybrid powertrain validation laboratory"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
torqueguard = "torqueguard.__main__:main"

[tool.setuptools.package-data]
torqueguard = ["web/*.html", "web/*.css", "web/*.js"]
